# ============================================================================
# Chronicle Docker Compose
# ============================================================================
# Development and production Docker stack.
# `make docker-up` starts just MariaDB + Redis for local dev.
# `make docker-all` starts the full stack including the app.
#
# For Cosmos Cloud deployment, import this file directly. Cosmos handles
# TLS termination and domain routing -- no exposed ports needed on the app.
# ============================================================================

services:
  # --- Chronicle Application ---
  # The Go binary serves HTTP directly (no nginx needed).
  # Cosmos Cloud reverse-proxies to this container.
  #
  # THIS SERVICE DELIBERATELY HAS NO `build:` SECTION. It used to have one
  # alongside `image:`, and that combination is what made a correct deploy look
  # like a failed one on 2026-08-11: it gave a single tag two producers.
  # `docker compose build` stamped a LOCAL build with this GHCR name, while
  # `docker compose pull` overwrote the same name from the registry — and
  # `docker compose up -d` did NEITHER, because an image with that tag already
  # existed locally. The operator deployed, saw no change, and then read image
  # labels off a months-old local image that was still holding the tag.
  #
  # `pull_policy: always` is the fix for the third of those: `up` is an
  # explicit operator action and it now always fetches the published image, so
  # the normal update path actually updates. Container restarts are handled by
  # `restart: unless-stopped` and do not re-pull, so this costs one registry
  # round trip per deliberate deploy, not per reboot.
  #
  # To build from source instead, use the override that keeps the two apart:
  #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
  # It tags the result `chronicle:local`, so a local build can never again
  # masquerade as the published image. See docs/deployment.md §6.
  chronicle:
    image: ghcr.io/${GITHUB_ORG:-keyxmakerx}/chronicle:latest
    pull_policy: always
    container_name: chronicle
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - ENV=${ENV:-production}
      - PORT=${PORT:-8080}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      # REQUIRED: Generate a unique key: openssl rand -base64 32
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set. Run openssl rand -base64 32}
      # -- Database (DB_PASSWORD must match MYSQL_PASSWORD below) --
      - DB_HOST=${DB_HOST:-chronicle-db:3306}
      - DB_USER=${DB_USER:-chronicle}
      - DB_PASSWORD=${DB_PASSWORD:-chronicle}
      - DB_NAME=${DB_NAME:-chronicle}
      - REDIS_URL=${REDIS_URL:-redis://chronicle-redis:6379}
      - MEDIA_PATH=${MEDIA_PATH:-./data/media}
      # Pre-migration backup destination (internal/database/healthcheck.go).
      # Defaults ON so every upgrade gets a safety-net dump before migrations
      # run. Lives inside the chronicle-data volume so it survives container
      # rebuilds; for offsite copies, see docs/deployment.md §8 (Backups).
      - BACKUP_DIR=${BACKUP_DIR:-/app/data/backups}
      # Production MUST set this — refuses boot if the pre-migration backup
      # fails. The default fail-open (warn + proceed) is preserved for
      # development setups without mariadb-client. Set to 1 in prod.
      - BACKUP_REQUIRED=${BACKUP_REQUIRED:-1}
      # Retention for scripts/backup.sh outputs. The in-process pre-migration
      # rotator uses a separate 7-day default in code (BackupMaxAge).
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - chronicle-data:/app/data
    depends_on:
      chronicle-db:
        condition: service_healthy
      chronicle-redis:
        condition: service_healthy
    labels:
      # Cosmos Cloud stack labels for auto-discovery
      cosmos-stack: chronicle
      cosmos-stack-main: chronicle

  # --- MariaDB ---
  chronicle-db:
    image: mariadb:latest
    container_name: chronicle-db
    restart: unless-stopped
    environment:
      # REQUIRED: Change these passwords before deploying.
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootsecret}
      - MYSQL_DATABASE=chronicle
      - MYSQL_USER=chronicle
      - MYSQL_PASSWORD=${DB_PASSWORD:-chronicle}
    volumes:
      - chronicle-dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      cosmos-stack: chronicle

  # --- Redis ---
  # Used for session storage, caching, and rate limiting.
  # 128MB max with LRU eviction -- sessions survive restarts via AOF.
  chronicle-redis:
    image: redis:alpine
    container_name: chronicle-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - chronicle-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      cosmos-stack: chronicle

volumes:
  chronicle-data:
    driver: local
  chronicle-dbdata:
    driver: local
  chronicle-redisdata:
    driver: local
