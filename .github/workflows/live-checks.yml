# ============================================================================
# Live checks
# ============================================================================
# Boots the real Chronicle binary on an empty MariaDB and Redis and drives it
# with a browser, running the click-path checks in test/live that used to wait
# for the operator (see tools/live-checks.sh).
#
# The checks still take pictures of the screens they visit, but nothing
# compares them, so a changed screen never fails this job.
#
# It runs only by hand (Actions > Live checks > Run workflow), before a large
# update, not on every pull request or push: the walks take 15 minutes or more
# and the fast checks in ci.yml guard each change. It is not required for
# merging. The smoke crawl (every link and GET route of the server the checks
# filled) runs too unless the run's "crawl" box is cleared.
# ============================================================================

name: Live checks

on:
  workflow_dispatch:
    inputs:
      crawl:
        description: 'Also run the smoke crawl (about 3 minutes)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live checks
    # Pinned with the Browser tests job in ci.yml: Playwright 1.56.1 has no
    # Chromium build for newer images.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: chronicle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1100

      - name: Generate templ files and CSS
        run: |
          templ generate
          make tailwind

      - name: Build
        run: go build -o bin/chronicle-live ./cmd/server

      # The backup checks run scripts/backup.sh, which needs MariaDB's own
      # mysqldump as the Chronicle image ships it: the runner's MySQL 8 client
      # asks MariaDB for a table it doesn't have and fails.
      - name: Install the MariaDB client
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mariadb-client
          mysqldump --version

      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Live checks
        env:
          CHRONICLE_BIN: bin/chronicle-live
          DB_HOST: 127.0.0.1:3306
          DB_ROOT_PASSWORD: chronicle
          REDIS_URL: redis://localhost:6379
          LIVE_SMOKE: ${{ inputs.crawl && '1' || '0' }}
        run: tools/live-checks.sh

      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-server-log
          path: |
            test-results/live/server.log
          if-no-files-found: ignore
