# ============================================================================
# Chronicle CI/CD Pipeline
# ============================================================================
# Triggers on pushes to main and pull requests.
# 1. Runs Go build, vet, and tests
# 2. Builds Docker image and pushes to GitHub Container Registry (ghcr.io)
#
# Image URL: ghcr.io/<owner>/chronicle:latest
# Pull with:  docker pull ghcr.io/<owner>/chronicle:latest
# ============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger from Actions UI when auto-triggers fail.

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- Build & Test ---
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Full history required by the plugin-isolation guard's diff-base lookup
        # (it diffs origin/<base>...HEAD; a shallow clone breaks that).
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install templ
        # Pin to the runtime version in go.mod. The generator and the
        # runtime go in lockstep — `@latest` drifts ahead of go.mod and
        # emits symbols (e.g. templ.ResolveAttributeValue) the pinned
        # runtime doesn't have, breaking every PR until go.mod catches up.
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Generate templ files
        run: templ generate

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Scrub guard (no operator instance hostnames in tracked source)
        # Operator-security requirement: production hostnames stay out of the
        # repo. The script reconstructs the forbidden token via fragment join
        # so it doesn't self-match.
        run: ./tools/check-no-instance-hostname.sh

      - name: Plugin isolation guard self-tests
        # Builds throwaway repos and proves the guard still bites, in
        # particular that the const_registry_files allowance covers
        # declarations only, not call sites in the same file. Needs no repo
        # history.
        run: ./tools/test-plugin-isolation.sh

      - name: Plugin isolation guard
        # Diff-scoped FAIL: catches NEW plugin-name string literals introduced
        # outside the owning plugin's directory, across all plugin slugs.
        # Existing violations are grandfathered. Needs full git history for
        # the diff (fetch-depth: 0 above).
        run: ./tools/check-plugin-isolation.sh

      - name: Migration immutability guard
        # Migrations are APPEND-ONLY. Fails the PR if it deletes or modifies a
        # migration file already on the base branch: a live DB may have
        # applied it, and golang-migrate needs every version up to the DB's
        # recorded one or boot crash-loops. New migrations are fine.
        # Diff-scoped; needs full git history (fetch-depth: 0 above).
        run: ./tools/check-migration-immutability.sh

      - name: V2 motion-discipline guard (§B2)
        # Diff-scoped FAIL: no NEW `transition: all` / `transition-all` in
        # calendar / timeline / ai_workspace / campaigns sources — only
        # `transform` and `opacity` may be animated there. Pre-existing
        # violations are grandfathered. Needs full git history;
        # fetch-depth: 0 above.
        run: ./tools/check-v2-motion-discipline.sh

      - name: Page-side script ratchet
        # A `<script src>` in a page templ sits inside the region every
        # hx-boost sidebar link swaps; htmx deletes script tags out of a
        # swapped fragment, so such a script only runs on direct load, not via
        # the sidebar. Scripts belong in the plugin body-script registry
        # (internal/app/routes.go), which base.templ emits outside the
        # swapped region.
        #
        # Whole-tree ratchet against tools/page-script-allowlist.txt, which
        # may only shrink. Needs no git history; self-tests on every run.
        run: ./tools/check-page-scripts.sh

      - name: Dead widget-mount ratchet
        # boot.js binds a `data-widget="name"` mount to whatever
        # Chronicle.register('name', …) put in its registry, and returns
        # silently when the name is absent — nothing lazy-loads the file, so a
        # widget whose JS is in no <script src> anywhere is a permanently
        # empty div with a page that looks finished.
        #
        # Whole-tree ratchet against tools/widget-mount-allowlist.txt, which
        # may only shrink. Needs no git history; self-tests on every run.
        run: ./tools/check-widget-mounts.sh

      - name: Test
        # Includes the cross-plugin import guard (TestPluginImportGuard in
        # internal/wire/plugin_import_guard_test.go): fails on any NEW
        # internal/plugins/A -> internal/plugins/B import edge outside the
        # grandfathered baseline.
        run: go test ./... -v -short

      - name: Restore-drill self-test
        # Runs tools/restore-drill.sh's real verify logic (migration
        # plausibility, row counts, FK spot check) against tiny fixtures in
        # testdata/restore-drill/, proving both the PASS path and every FAIL
        # path still fire. Spins real, disposable MariaDB containers;
        # ubuntu-latest ships Docker, no setup needed.
        run: ./tools/test-restore-drill.sh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: JS tests
        # Gates the node --test JS suite (sidebar tree/reorder, boosted-nav
        # highlight, calendar/world-state widgets, …) so red JS tests cannot
        # linger on main unnoticed. Uses Node's built-in test runner, no deps.
        run: make test-js

      - name: Decision-citations lint (WARN-only)
        # Surfaces orphan cordinator/decisions/*.md docs. WARN-only: always
        # exits 0. In Chronicle CI the Cordinator repo isn't checked out, so
        # this prints "nothing to check" and exits clean; it is fully
        # effective only when run alongside that repo.
        continue-on-error: true
        run: ./tools/check-decision-citations.sh

  # --- Fresh-database migration replay ---
  # Every other integration test assumes `make migrate-up` already ran, so
  # this job replays every migration against a NEVER-migrated database — the
  # shape a brand-new self-hosted install actually starts from. A separate job
  # rather than a service on "Build & Test": the replay needs a database, the
  # main job must keep running with none, and coupling them would let a DB
  # hiccup redden the entire build.
  freshdb:
    name: Fresh-DB Migration Replay
    runs-on: ubuntu-latest
    services:
      mariadb:
        # Matches the version docker-compose.yml pins for the dev database, so
        # a migration that only fails on a different server version cannot slip
        # through here and land on operators.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: chronicle
          MARIADB_DATABASE: chronicle
          MARIADB_USER: chronicle
          MARIADB_PASSWORD: chronicle
        ports:
          - 3306:3306
        # The scratch schemas the replay creates need CREATE/DROP DATABASE, so
        # it connects as root; the health check gates the job on readiness.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Generate templ files
        run: templ generate

      - name: Fresh-database migration replay
        # NOT `-short`: these tests skip under it by design. The explicit
        # PASS-line assertion below makes a silent skip impossible, so this
        # job cannot report success having tested nothing.
        env:
          CHRONICLE_TEST_DB_DSN: root:chronicle@tcp(127.0.0.1:3306)/
        run: |
          go test ./cmd/server/ -v -run 'TestFreshDatabase_|TestUpgradeDatabase_' \
            2>&1 | tee replay.log
          go test ./internal/database/ -v -run 'TestPluginMigration_' \
            2>&1 | tee -a replay.log
          for want in TestFreshDatabase_EveryPluginSchemaApplies \
                      TestUpgradeDatabase_FoundryConsolidationStillRuns \
                      TestPluginMigration_ResumesInsteadOfCrashLooping \
                      TestPluginMigration_PreflightRefusesBeforeApplyingAnything \
                      TestPluginMigration_IgnoresProgressRecordedForDifferentSQL; do
            grep -q -- "--- PASS: $want" replay.log || {
              echo "::error::$want did not PASS — it was skipped or never ran."
              echo "This job exists because a skipped fresh-DB replay is why"
              echo "every new self-hosted install shipped with a dead plugin."
              exit 1
            }
          done

  # --- Lint ---
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install templ
        # Pin to the runtime version in go.mod. The generator and the
        # runtime go in lockstep — `@latest` drifts ahead of go.mod and
        # emits symbols (e.g. templ.ResolveAttributeValue) the pinned
        # runtime doesn't have, breaking every PR until go.mod catches up.
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Generate templ files
        run: templ generate

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint refuses to run against a module whose `go` directive
          # names a newer language version than the binary analyzing it was
          # built with. Bump this pin together with go.mod's `go` directive.
          version: v2.13.2

  # --- Security Scan ---
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install govulncheck
        # Pinned so @latest can't drift ahead of this job's go-version and
        # require a newer toolchain than is installed. Bump this pin together
        # with the job's go-version whenever a future release raises its
        # minimum above what setup-go installs here.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        # continue-on-error: vuln.go.dev is not reachable from every CI
        # environment. Do not flip this to blocking without a real clean run's
        # output in hand from an environment that can reach it — an
        # unverified "clean" is worse than a known gap.
        continue-on-error: true
        run: govulncheck ./...

  # --- Docker Build & Push to GHCR ---
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    # Only push images on main branch pushes, tags, or manual dispatch — not PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # org.opencontainers.image.revision is the commit built; .created is the
      # real build time — both come from metadata-action directly and are
      # correct as-is. `docker inspect <tag>` reports whichever image holds
      # that tag NOW, which is not necessarily the image a running container
      # was created from — see docs/deployment.md §6 for how to identify a
      # running Chronicle instead. The one label overridden here is
      # description: the action's default is the GitHub repo description,
      # which would otherwise clobber the Dockerfile's own "labels describe an
      # image, not a process" warning.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with "latest" on main branch pushes
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with semver on version tags (v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag with short SHA for traceability
            type=sha,prefix=
          # NOTE: metadata-action compiles every custom label through
          # Handlebars (meta.ts: setGlobalExp -> handlebars.compile), so this
          # string must contain no {{ }} braces. That rules out spelling the
          # `docker inspect --format` template inline; docs/deployment.md §6
          # carries the exact command instead.
          labels: |
            org.opencontainers.image.description=Self-hosted TTRPG worldbuilding platform. These labels describe an IMAGE, not a running container - docker inspect on a tag answers for whichever image holds that tag now, which may not be the image a running container was created from. To identify a RUNNING Chronicle, ask the process - GET /api/version, or Admin > Diagnostics > host.build. See docs/deployment.md section 6.

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CHRONICLE_VERSION names a RELEASE, and only a tag is one; a
          # main-branch push falls through to empty, which the binary itself
          # resolves to its commit SHA (see internal/hostinfo) — the honest
          # answer, not the literal string "latest".
          build-args: |
            CHRONICLE_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
            VCS_REF=${{ github.sha }}
          # provenance/sbom attestations add manifest/blob entries that ghcr.io
          # intermittently rejects on push; disabled since nothing consumes
          # them. Keep any new step BELOW this `with:` map, never between its
          # keys — YAML would fold new lines placed between them into this
          # block scalar instead.
          provenance: false
          sbom: false

      # Go skips VCS stamping silently when `git` is missing from the builder
      # stage, producing an anonymous binary — this step catches that by
      # inspecting the PUSHED image (addressed by digest) for the commit SHA.
      # `env.IMAGE_NAME` keeps the repository's mixed-case spelling, but a
      # Docker reference must be lowercase, so it is lowercased explicitly
      # here (metadata-action does this for its own `images:` input
      # automatically).
      - name: Verify the published binary is VCS-stamped
        run: |
          set -euo pipefail
          REPO="${{ env.IMAGE_NAME }}"
          IMAGE="${{ env.REGISTRY }}/${REPO,,}@${{ steps.build.outputs.digest }}"
          echo "verifying $IMAGE"
          docker pull -q "$IMAGE"
          if docker run --rm --entrypoint grep "$IMAGE" -q -F "${{ github.sha }}" /usr/local/bin/chronicle; then
            echo "OK: binary embeds vcs.revision=${{ github.sha }}"
          else
            echo "::error::Published binary has no VCS stamp for ${{ github.sha }}. Go silently skips stamping when git is absent from the builder stage — check the 'apk add git' in Dockerfile stage 2. GET /api/version and host.build will report an unidentified build."
            exit 1
          fi
