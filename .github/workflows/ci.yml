# ============================================================================
# Chronicle CI/CD Pipeline
# ============================================================================
# Triggers on pushes to main and pull requests.
# 1. Runs Go build, vet, and tests
# 2. Builds Docker image and pushes to GitHub Container Registry (ghcr.io)
#
# Image URL: ghcr.io/<owner>/chronicle:latest
# Pull with:  docker pull ghcr.io/<owner>/chronicle:latest
# ============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger from Actions UI when auto-triggers fail.

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- Build & Test ---
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        # Full history required by the plugin-isolation guard's diff-base lookup
        # (it diffs origin/<base>...HEAD; a shallow clone breaks that).
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Install templ
        # Pin to the runtime version in go.mod. The generator and the
        # runtime go in lockstep — `@latest` drifts ahead of go.mod and
        # emits symbols (e.g. templ.ResolveAttributeValue) the pinned
        # runtime doesn't have, breaking every PR until go.mod catches up.
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Generate templ files
        run: templ generate

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Scrub guard (no operator instance hostnames in tracked source)
        # Per C-SCRUB-INSTANCE-URLS (2026-05-20): operator-security
        # requirement that production hostnames stay out of the repo.
        # The script itself reconstructs the forbidden token via fragment
        # join so it doesn't fail-self.
        run: ./tools/check-no-instance-hostname.sh

      - name: Plugin isolation guard self-tests (R4-S26-A)
        # The guard sat red for nine commits during sweep R4 because nothing
        # ran it and nothing tested it. These self-tests build throwaway repos
        # and prove the guard still bites — in particular that the
        # const_registry_files allowance covers declarations only and not the
        # call sites in the same file. Hermetic: needs no repo history.
        run: ./tools/test-plugin-isolation.sh

      - name: Plugin isolation guard (M-B2.1 extended)
        # Per C-MODULARITY-PRELAUNCH-QUICKWINS + cordinator/decisions/2026-05-21-core-tenets.md §T-B2.
        # Diff-scoped FAIL: catches NEW plugin-name string literals introduced
        # outside the owning plugin's directory. Extended from foundry-vtt-only
        # to all plugin slugs (2026-06-21). Existing violations grandfathered.
        # Needs full git history for the diff; fetch-depth: 0 above.
        run: ./tools/check-plugin-isolation.sh

      - name: Migration immutability guard
        # Per ADR-044 + the 2026-06-24 `000030` incident: migrations are
        # APPEND-ONLY. Fails the PR if it DELETES or MODIFIES a migration file
        # that already exists on the base branch (a live DB may have applied it;
        # golang-migrate's file:// source must contain every version up to the
        # DB's recorded version, or boot crash-loops). New migrations are fine.
        # Diff-scoped; needs full git history (fetch-depth: 0 above).
        run: ./tools/check-migration-immutability.sh

      # NOTE: the "Templ drift guard" step that used to sit here was DELETED by
      # C-CALV4-FOUNDATION-P0 along with tools/check-templ-drift.sh. It diffed
      # pathspec '*.templ.go' while templ emits '*_templ.go', and those are
      # gitignored (.gitignore:30) and never committed — so it was structurally
      # incapable of failing and reported OK on a tree where 753 generated files
      # had just changed. A guard that cannot fail is worse than no guard: it
      # reads as coverage. The "Generate templ files" + "Build" steps above
      # already catch real drift, because a stale generator output fails to
      # compile.

      - name: V2 motion-discipline guard (§B2)
        # Per cordinator/decisions/2026-05-28-cal-timeline-v2-design.md §B2.
        # The script has existed since the V2 wave but was invoked by NOTHING —
        # only referenced by a comment at static/css/input.css:103. Wired here
        # by C-CALV4-FOUNDATION-P0. Diff-scoped FAIL: no NEW `transition: all` /
        # `transition-all` in calendar / timeline / ai_workspace / campaigns
        # sources. Pre-existing violations are grandfathered (7 lines across 5
        # files as of this wiring). Needs full git history; fetch-depth: 0 above.
        run: ./tools/check-v2-motion-discipline.sh

      - name: Calendar-v4 guards B1–B4
        # Per cordinator/decisions/2026-07-26-calendar-v4-canon-amendments.md §B.
        # B1 no --dash/--gap in a transition/animation list · B2 no `font:`
        # shorthand naming `inherit` as the family · B3 no interactive control
        # reusing an <html> state-marker attribute name · B4 every data-cell /
        # data-row marker also carries `data-day`. Diff-scoped; needs full git
        # history (fetch-depth: 0 above). Every run first self-tests the guard
        # against embedded fixtures, so "OK" always means the rules can fire.
        run: ./tools/check-calendar-v4-lints.sh

      - name: Page-side script ratchet
        # A `<script src>` in a page templ sits inside <main id="main-content">,
        # the region every hx-boost sidebar link swaps; boot.js sets
        # htmx.config.allowScriptTags=false, at which point htmx DELETES script
        # tags out of the swapped fragment. The surface then wires on a direct
        # load and silently does not through the sidebar — invisibly, because
        # the stylesheets beside it survive. That is how the Calendar Bench
        # shipped with a dead day card and a dead Permissions button. Scripts
        # belong in the plugin body-script registry (internal/app/routes.go),
        # which base.templ emits outside the swapped region.
        #
        # Whole-tree ratchet against tools/page-script-allowlist.txt, which may
        # only shrink. Needs no git history. Every run self-tests first, so "OK"
        # means the rule can fire. Sweep of the survivors: C-HTMX-SCRIPT-SWEEP.
        run: ./tools/check-page-scripts.sh

      - name: Dead widget-mount ratchet
        # boot.js binds a `data-widget="name"` mount to whatever
        # Chronicle.register('name', …) put in its registry, and RETURNS
        # SILENTLY when the name is absent. Nothing lazy-loads the file — no
        # script injection, no dynamic import, no bundler. So a widget whose JS
        # is in no <script src> anywhere is a permanently empty div, with an
        # empty console and a page that looks finished. That is how `aliases`,
        # `inventory` and `transaction_log` shipped fully built and permanently
        # blank on entity pages (C-SWEEP-R3).
        #
        # Whole-tree ratchet against tools/widget-mount-allowlist.txt, which may
        # only shrink. Needs no git history. Every run self-tests first, so "OK"
        # means the rule can fire.
        run: ./tools/check-widget-mounts.sh

      - name: Test
        # Includes M-B2.2 cross-plugin import guard (TestPluginImportGuard in
        # internal/wire/plugin_import_guard_test.go): fails on any NEW
        # internal/plugins/A → internal/plugins/B import edge outside the
        # grandfathered baseline. Per C-MODULARITY-PRELAUNCH-QUICKWINS +
        # cordinator/decisions/2026-05-21-core-tenets.md §T-B2.
        run: go test ./... -v -short

      - name: Restore-drill self-test
        # Per C-BACKUP-RESTORE-KIT + cordinator/plans/2026-07-10-beta-transition-plan.md
        # §2 item 0.6. Runs tools/restore-drill.sh's real verify logic (migrations
        # plausibility, row counts, FK spot check) against tiny fixtures in
        # testdata/restore-drill/ — proves both the PASS path and every FAIL path
        # still fire, so the drill kit itself can't rot silently. Spins real,
        # disposable MariaDB containers; ubuntu-latest ships Docker, no setup needed.
        run: ./tools/test-restore-drill.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS tests
        # B-R8 (cordinator/decisions/2026-07-10-beta-transition-rulings.md):
        # gate the node --test JS suite (sidebar tree/reorder, boosted-nav
        # highlight, calendar/world-state widgets, …) so red JS tests can no
        # longer linger on main unnoticed. Uses Node's built-in test runner
        # (no deps). The two dead sidebar_reorg tests that failed on main were
        # removed in this same change, so the suite gates green.
        run: make test-js

      - name: Decision-citations lint (M-O3.1, WARN-only)
        # Per C-CI-GUARDS-PHASE-2 + cordinator/reports/coordinator/2026-05-21-c-meta-audit.md
        # Phase 2 deliverable. Surfaces orphan cordinator/decisions/*.md docs.
        # WARN-only: always exits 0. In Chronicle CI the Cordinator repo isn't
        # checked out, so this prints "nothing to check" and exits clean. The
        # guard is fully effective when run from a coordinator session that
        # has all three repos local. Kept here so any future CI runner that
        # checks out all three repos exercises it automatically.
        continue-on-error: true
        run: ./tools/check-decision-citations.sh

  # --- Fresh-database migration replay ---
  # C-SWEEP-R4 (data/fvtt-fresh-db-rename). Until this job existed, CI never
  # migrated an EMPTY database anywhere: the restore drill loads a dump of an
  # already-migrated one, and every other integration test assumes
  # `make migrate-up` already ran. So foundry_vtt's migration 001 — which
  # RENAMEs a table the deleted foundry_modules plugin used to create — failed
  # on its first statement on every brand-new self-hosted install, permanently
  # disabling the Foundry integration, and the whole suite stayed green.
  #
  # A separate job rather than a service on "Build & Test" deliberately: the
  # replay needs a database, the main job must keep running with none, and
  # coupling them would let a DB hiccup redden the entire build.
  freshdb:
    name: Fresh-DB Migration Replay
    runs-on: ubuntu-latest
    services:
      mariadb:
        # Matches the version docker-compose.yml pins for the dev database, so
        # a migration that only fails on a different server version cannot slip
        # through here and land on operators.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: chronicle
          MARIADB_DATABASE: chronicle
          MARIADB_USER: chronicle
          MARIADB_PASSWORD: chronicle
        ports:
          - 3306:3306
        # The scratch schemas the replay creates need CREATE/DROP DATABASE, so
        # it connects as root; the health check gates the job on readiness.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Generate templ files
        run: templ generate

      - name: Fresh-database migration replay
        # NOT `-short`: these tests skip under it by design, which is exactly
        # how this class of bug survived. If no server answers they SKIP, so
        # the explicit reachability assertion below is what makes a silent skip
        # impossible — a job that reports success having tested nothing is the
        # failure mode this whole job exists to end.
        env:
          CHRONICLE_TEST_DB_DSN: root:chronicle@tcp(127.0.0.1:3306)/
        run: |
          go test ./cmd/server/ -v -run 'TestFreshDatabase_|TestUpgradeDatabase_' \
            2>&1 | tee replay.log
          go test ./internal/database/ -v -run 'TestPluginMigration_' \
            2>&1 | tee -a replay.log
          for want in TestFreshDatabase_EveryPluginSchemaApplies \
                      TestUpgradeDatabase_FoundryConsolidationStillRuns \
                      TestPluginMigration_ResumesInsteadOfCrashLooping \
                      TestPluginMigration_PreflightRefusesBeforeApplyingAnything \
                      TestPluginMigration_IgnoresProgressRecordedForDifferentSQL; do
            grep -q -- "--- PASS: $want" replay.log || {
              echo "::error::$want did not PASS — it was skipped or never ran."
              echo "This job exists because a skipped fresh-DB replay is why"
              echo "every new self-hosted install shipped with a dead plugin."
              exit 1
            }
          done

  # --- Real-browser probes ---
  # C-SWEEP-R4 (guards/probes-never-run-in-ci). The probes are the ONLY tests
  # in the repo that look at the RENDERED result — they drive a headless
  # Chromium over a built page and read geometry out of the live layout. Every
  # other test asserts on the strings we emitted, which cannot tell you whether
  # a container query resolved, a shelf collided with the ledger, a card
  # anchored to its day, or the phone breakpoint swapped the assembly.
  #
  # Not one of them had ever run here. They all begin
  # `if testing.Short() { t.Skip }`, and "Build & Test" above runs
  # `go test ./... -v -short`; they then skip again with no browser, and a
  # `go test` SKIP is reported inside an `ok` package line. A rendering
  # regression could land on main with a completely green build — proven by
  # changing the Shelf scroller's max-height in static/css/calendar-block.css
  # and watching `-short` stay green while the probe catches it.
  #
  # A separate job because it needs a browser and a CSS toolchain that the main
  # job must not have to install, and because its runtime is dominated by the
  # browser rather than by Go. BROWSER_PROBES_REQUIRED=1 makes a missing
  # Chromium fatal HERE specifically: a runner whose browser install broke must
  # redden the build, not quietly measure nothing. Locally the same script
  # names what it could not run and exits clean.
  probes:
    name: Browser Probes
    runs-on: ubuntu-latest
    env:
      # The layout the probes' Chromium finders glob for.
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
      BROWSER_PROBES_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Generate templ files
        run: templ generate

      - name: Install Chromium
        # --with-deps pulls the shared libraries a headless Chromium needs on a
        # bare ubuntu-latest image; without them the binary exists and every
        # probe dies on launch instead of skipping, which the guard reports as
        # a failure rather than an absence — correctly.
        run: npx --yes playwright@1.49.1 install --with-deps chromium

      - name: Install Tailwind CLI
        # TestProbe_MobileBreakpointSwapInRealBrowser measures a breakpoint that
        # only exists in the BUILT stylesheet, so it needs the CLI on top of the
        # browser. Tracked as its own dependency by the guard so a missing
        # Tailwind cannot take the browser-only probes down with it.
        run: npm install --no-save --no-audit --no-fund tailwindcss@3.4.17

      - name: Drive the browser probes
        # Runs them WITHOUT -short and then requires a `--- PASS:` line from
        # each probe by name. A probe that skipped, failed, was renamed or was
        # deleted fails this job — the coverage cannot evaporate quietly.
        run: ./tools/check-browser-probes.sh

  # --- Lint ---
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Install templ
        # Pin to the runtime version in go.mod. The generator and the
        # runtime go in lockstep — `@latest` drifts ahead of go.mod and
        # emits symbols (e.g. templ.ResolveAttributeValue) the pinned
        # runtime doesn't have, breaking every PR until go.mod catches up.
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Generate templ files
        run: templ generate

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

  # --- Security Scan ---
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Install govulncheck
        # Pinned: @latest broke CI when x/vuln moved to `go 1.25.0` (v1.2.0+)
        # against our go-version 1.24 + GOTOOLCHAIN=local. v1.1.4 declares
        # `go 1.22.0` (verified in its go.mod). Bump this pin together with
        # the job's go-version when the toolchain moves to 1.25.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        # Advisory: stdlib vulnerabilities require a Go toolchain upgrade.
        # Non-blocking so stdlib-only findings don't break CI.
        continue-on-error: true
        run: govulncheck ./...

  # --- Docker Build & Push to GHCR ---
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    # Only push images on main branch pushes, tags, or manual dispatch — not PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Where the OCI labels come from — verified against metadata-action's own
      # source (src/meta.ts), because on 2026-08-11 an hour was spent reasoning
      # from these labels and nobody had read what produces them:
      #
      #   org.opencontainers.image.revision = this.context.sha
      #                                       -> the commit being built. Correct.
      #   org.opencontainers.image.created  = this.date.toISOString(), where
      #                                       this.date = new Date() in the Meta
      #                                       constructor -> the moment the action
      #                                       ran, i.e. real build time. Correct.
      #
      # THE LABELS WERE NEVER WRONG. The February revision/created pair that
      # triggered the incident described, accurately, a February CI image that
      # was still holding the :latest tag in the deploy host's local image
      # store. `docker inspect <tag>` reports whichever image holds that tag
      # NOW; a running container keeps the image ID it was CREATED FROM. The
      # two were different images and nothing in the output said so. The defect
      # was in the deploy path (docker-compose.yml declaring both image: and
      # build:, and `up -d` neither rebuilding nor re-pulling) and in
      # Chronicle's inability to self-report — both fixed elsewhere in this
      # change. Nothing here needed "correcting"; overriding `created` with a
      # commit timestamp, the obvious-looking fix, would have made it wrong for
      # the first time.
      #
      # The one label we DO override is description: the action's default is
      # the GitHub repo description, and it would otherwise clobber the
      # Dockerfile's copy of the "labels describe an image, not a process"
      # warning on exactly the CI-built images an operator inspects.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with "latest" on main branch pushes
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with semver on version tags (v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag with short SHA for traceability
            type=sha,prefix=
          # NOTE: metadata-action compiles every custom label through
          # Handlebars (meta.ts: setGlobalExp -> handlebars.compile), so this
          # string must contain no {{ }} braces. That rules out spelling the
          # `docker inspect --format` template inline; docs/deployment.md §6
          # carries the exact command instead.
          labels: |
            org.opencontainers.image.description=Self-hosted TTRPG worldbuilding platform. These labels describe an IMAGE, not a running container - docker inspect on a tag answers for whichever image holds that tag now, which may not be the image a running container was created from. To identify a RUNNING Chronicle, ask the process - GET /api/version, or Admin > Diagnostics > host.build. See docs/deployment.md section 6.

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CHRONICLE_VERSION names a RELEASE, and only a tag is one. On a
          # main-branch push metadata-action's `version` output is the literal
          # "latest", which is a tag name, not a version — feeding that to
          # GET /api/version would be a downgrade from the commit SHA the
          # binary now stamps in by itself. Empty here falls through to that
          # SHA (see internal/hostinfo), which is the honest answer.
          build-args: |
            CHRONICLE_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
            VCS_REF=${{ github.sha }}
          # Disable provenance + SBOM attestations. build-push-action
          # generates these by default, which adds extra manifest/blob
          # entries that ghcr.io intermittently rejects on push with
          # "ERROR: unknown blob". We don't consume the attestations, so
          # turning them off both fixes the flaky push and produces a
          # cleaner single-manifest image.
          #
          # These two keys previously ended up INSIDE the verify step's `run:`
          # block scalar — the new step was inserted between them and the rest
          # of this `with:` map, so YAML read them as two more shell lines. They
          # were dead for one build, and the run's metadata proved it by
          # reporting a `buildx.build.provenance` object that should not have
          # existed. A silently-disabled setting is worse than a missing one:
          # keep any new step BELOW this map, never between its keys.
          provenance: false
          sbom: false

      # Guard against a SILENT regression, not a hypothetical one. Go skips VCS
      # stamping without a word when `git` is missing from the builder — exit 0,
      # no warning, an anonymous binary — and that is exactly how every image
      # before this change shipped unable to identify itself. If someone drops
      # the `apk add git` from the Dockerfile, this step is what says so.
      #
      # It inspects the image that was actually PUSHED, addressed by digest so
      # there is no chance of checking a different artifact than the one
      # published — the precise ambiguity that caused the incident. Go writes
      # vcs.revision into the binary as plain text, so grep is sufficient and
      # needs no Go toolchain in the runtime image. The push has already
      # happened by this point, so a failure here does not withhold the
      # artifact; it loudly labels it unidentifiable.
      # `env.IMAGE_NAME` is `keyxmakerx/Chronicle`, matching the repository's
      # own capitalisation — but a Docker reference must be lowercase, and the
      # daemon rejects the whole string rather than folding case. Everywhere
      # else this is invisible because metadata-action lowercases its `images:`
      # input for us; this step is the one place the reference is assembled by
      # hand, so it must lowercase explicitly. The first run failed here, in
      # under a second, on `invalid reference format: repository name
      # (keyxmakerx/Chronicle@sha256) must be lowercase`.
      - name: Verify the published binary is VCS-stamped
        run: |
          set -euo pipefail
          REPO="${{ env.IMAGE_NAME }}"
          IMAGE="${{ env.REGISTRY }}/${REPO,,}@${{ steps.build.outputs.digest }}"
          echo "verifying $IMAGE"
          docker pull -q "$IMAGE"
          if docker run --rm --entrypoint grep "$IMAGE" -q -F "${{ github.sha }}" /usr/local/bin/chronicle; then
            echo "OK: binary embeds vcs.revision=${{ github.sha }}"
          else
            echo "::error::Published binary has no VCS stamp for ${{ github.sha }}. Go silently skips stamping when git is absent from the builder stage — check the 'apk add git' in Dockerfile stage 2. GET /api/version and host.build will report an unidentified build."
            exit 1
          fi
