# ============================================================================
# Chronicle CI/CD Pipeline
# ============================================================================
# Triggers on pushes to main and pull requests.
# 1. Runs Go build, vet, and tests
# 2. Builds Docker image and pushes to GitHub Container Registry (ghcr.io)
#
# Image URL: ghcr.io/<owner>/chronicle:latest
# Pull with:  docker pull ghcr.io/<owner>/chronicle:latest
# ============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger from Actions UI when auto-triggers fail.

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- Build & Test ---
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        # Full history required by the plugin-isolation guard's diff-base lookup
        # (it diffs origin/<base>...HEAD; a shallow clone breaks that).
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Install templ
        # Pin to the runtime version in go.mod. The generator and the
        # runtime go in lockstep — `@latest` drifts ahead of go.mod and
        # emits symbols (e.g. templ.ResolveAttributeValue) the pinned
        # runtime doesn't have, breaking every PR until go.mod catches up.
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Generate templ files
        run: templ generate

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Scrub guard (no operator instance hostnames in tracked source)
        # Per C-SCRUB-INSTANCE-URLS (2026-05-20): operator-security
        # requirement that production hostnames stay out of the repo.
        # The script itself reconstructs the forbidden token via fragment
        # join so it doesn't fail-self.
        run: ./tools/check-no-instance-hostname.sh

      - name: Plugin isolation guard (M-B2.1 extended)
        # Per C-MODULARITY-PRELAUNCH-QUICKWINS + cordinator/decisions/2026-05-21-core-tenets.md §T-B2.
        # Diff-scoped FAIL: catches NEW plugin-name string literals introduced
        # outside the owning plugin's directory. Extended from foundry-vtt-only
        # to all plugin slugs (2026-06-21). Existing violations grandfathered.
        # Needs full git history for the diff; fetch-depth: 0 above.
        run: ./tools/check-plugin-isolation.sh

      - name: Migration immutability guard
        # Per ADR-044 + the 2026-06-24 `000030` incident: migrations are
        # APPEND-ONLY. Fails the PR if it DELETES or MODIFIES a migration file
        # that already exists on the base branch (a live DB may have applied it;
        # golang-migrate's file:// source must contain every version up to the
        # DB's recorded version, or boot crash-loops). New migrations are fine.
        # Diff-scoped; needs full git history (fetch-depth: 0 above).
        run: ./tools/check-migration-immutability.sh

      # NOTE: the "Templ drift guard" step that used to sit here was DELETED by
      # C-CALV4-FOUNDATION-P0 along with tools/check-templ-drift.sh. It diffed
      # pathspec '*.templ.go' while templ emits '*_templ.go', and those are
      # gitignored (.gitignore:30) and never committed — so it was structurally
      # incapable of failing and reported OK on a tree where 753 generated files
      # had just changed. A guard that cannot fail is worse than no guard: it
      # reads as coverage. The "Generate templ files" + "Build" steps above
      # already catch real drift, because a stale generator output fails to
      # compile.

      - name: V2 motion-discipline guard (§B2)
        # Per cordinator/decisions/2026-05-28-cal-timeline-v2-design.md §B2.
        # The script has existed since the V2 wave but was invoked by NOTHING —
        # only referenced by a comment at static/css/input.css:103. Wired here
        # by C-CALV4-FOUNDATION-P0. Diff-scoped FAIL: no NEW `transition: all` /
        # `transition-all` in calendar / timeline / ai_workspace / campaigns
        # sources. Pre-existing violations are grandfathered (7 lines across 5
        # files as of this wiring). Needs full git history; fetch-depth: 0 above.
        run: ./tools/check-v2-motion-discipline.sh

      - name: Calendar-v4 guards B1–B4
        # Per cordinator/decisions/2026-07-26-calendar-v4-canon-amendments.md §B.
        # B1 no --dash/--gap in a transition/animation list · B2 no `font:`
        # shorthand naming `inherit` as the family · B3 no interactive control
        # reusing an <html> state-marker attribute name · B4 every data-cell /
        # data-row marker also carries `data-day`. Diff-scoped; needs full git
        # history (fetch-depth: 0 above). Every run first self-tests the guard
        # against embedded fixtures, so "OK" always means the rules can fire.
        run: ./tools/check-calendar-v4-lints.sh

      - name: Page-side script ratchet
        # A `<script src>` in a page templ sits inside <main id="main-content">,
        # the region every hx-boost sidebar link swaps; boot.js sets
        # htmx.config.allowScriptTags=false, at which point htmx DELETES script
        # tags out of the swapped fragment. The surface then wires on a direct
        # load and silently does not through the sidebar — invisibly, because
        # the stylesheets beside it survive. That is how the Calendar Bench
        # shipped with a dead day card and a dead Permissions button. Scripts
        # belong in the plugin body-script registry (internal/app/routes.go),
        # which base.templ emits outside the swapped region.
        #
        # Whole-tree ratchet against tools/page-script-allowlist.txt, which may
        # only shrink. Needs no git history. Every run self-tests first, so "OK"
        # means the rule can fire. Sweep of the survivors: C-HTMX-SCRIPT-SWEEP.
        run: ./tools/check-page-scripts.sh

      - name: Dead widget-mount ratchet
        # boot.js binds a `data-widget="name"` mount to whatever
        # Chronicle.register('name', …) put in its registry, and RETURNS
        # SILENTLY when the name is absent. Nothing lazy-loads the file — no
        # script injection, no dynamic import, no bundler. So a widget whose JS
        # is in no <script src> anywhere is a permanently empty div, with an
        # empty console and a page that looks finished. That is how `aliases`,
        # `inventory` and `transaction_log` shipped fully built and permanently
        # blank on entity pages (C-SWEEP-R3).
        #
        # Whole-tree ratchet against tools/widget-mount-allowlist.txt, which may
        # only shrink. Needs no git history. Every run self-tests first, so "OK"
        # means the rule can fire.
        run: ./tools/check-widget-mounts.sh

      - name: Test
        # Includes M-B2.2 cross-plugin import guard (TestPluginImportGuard in
        # internal/wire/plugin_import_guard_test.go): fails on any NEW
        # internal/plugins/A → internal/plugins/B import edge outside the
        # grandfathered baseline. Per C-MODULARITY-PRELAUNCH-QUICKWINS +
        # cordinator/decisions/2026-05-21-core-tenets.md §T-B2.
        run: go test ./... -v -short

      - name: Restore-drill self-test
        # Per C-BACKUP-RESTORE-KIT + cordinator/plans/2026-07-10-beta-transition-plan.md
        # §2 item 0.6. Runs tools/restore-drill.sh's real verify logic (migrations
        # plausibility, row counts, FK spot check) against tiny fixtures in
        # testdata/restore-drill/ — proves both the PASS path and every FAIL path
        # still fire, so the drill kit itself can't rot silently. Spins real,
        # disposable MariaDB containers; ubuntu-latest ships Docker, no setup needed.
        run: ./tools/test-restore-drill.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS tests
        # B-R8 (cordinator/decisions/2026-07-10-beta-transition-rulings.md):
        # gate the node --test JS suite (sidebar tree/reorder, boosted-nav
        # highlight, calendar/world-state widgets, …) so red JS tests can no
        # longer linger on main unnoticed. Uses Node's built-in test runner
        # (no deps). The two dead sidebar_reorg tests that failed on main were
        # removed in this same change, so the suite gates green.
        run: make test-js

      - name: Decision-citations lint (M-O3.1, WARN-only)
        # Per C-CI-GUARDS-PHASE-2 + cordinator/reports/coordinator/2026-05-21-c-meta-audit.md
        # Phase 2 deliverable. Surfaces orphan cordinator/decisions/*.md docs.
        # WARN-only: always exits 0. In Chronicle CI the Cordinator repo isn't
        # checked out, so this prints "nothing to check" and exits clean. The
        # guard is fully effective when run from a coordinator session that
        # has all three repos local. Kept here so any future CI runner that
        # checks out all three repos exercises it automatically.
        continue-on-error: true
        run: ./tools/check-decision-citations.sh

  # --- Lint ---
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Install templ
        # Pin to the runtime version in go.mod. The generator and the
        # runtime go in lockstep — `@latest` drifts ahead of go.mod and
        # emits symbols (e.g. templ.ResolveAttributeValue) the pinned
        # runtime doesn't have, breaking every PR until go.mod catches up.
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Generate templ files
        run: templ generate

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

  # --- Security Scan ---
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Install govulncheck
        # Pinned: @latest broke CI when x/vuln moved to `go 1.25.0` (v1.2.0+)
        # against our go-version 1.24 + GOTOOLCHAIN=local. v1.1.4 declares
        # `go 1.22.0` (verified in its go.mod). Bump this pin together with
        # the job's go-version when the toolchain moves to 1.25.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        # Advisory: stdlib vulnerabilities require a Go toolchain upgrade.
        # Non-blocking so stdlib-only findings don't break CI.
        continue-on-error: true
        run: govulncheck ./...

  # --- Docker Build & Push to GHCR ---
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    # Only push images on main branch pushes, tags, or manual dispatch — not PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with "latest" on main branch pushes
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with semver on version tags (v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag with short SHA for traceability
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disable provenance + SBOM attestations. build-push-action@v6
          # generates these by default, which adds extra manifest/blob
          # entries that ghcr.io intermittently rejects on push with
          # "ERROR: unknown blob". We don't consume the attestations, so
          # turning them off both fixes the flaky push and produces a
          # cleaner single-manifest image.
          provenance: false
          sbom: false
